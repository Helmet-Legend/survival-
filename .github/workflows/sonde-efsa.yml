name: Sonde EFSA (temporaire)
on:
  push:
    branches: [ccr-68193128-o7em9g]
    paths: ['.github/workflows/sonde-efsa.yml']
jobs:
  sonde:
    runs-on: ubuntu-latest
    steps:
      - run: sudo apt-get install -y poppler-utils >/dev/null
      - name: Énergie EFSA 2013 (tableau 8 et annexes en kcal)
        run: |
          curl -sSL -A "Mozilla/5.0" -o e.pdf "https://efsa.onlinelibrary.wiley.com/doi/pdf/10.2903/j.efsa.2013.3005"
          file e.pdf | grep -q PDF || curl -sSL -A "Mozilla/5.0" -o e.pdf "https://www.efsa.europa.eu/sites/default/files/consultation/120720.pdf"
          file e.pdf
          pdftotext -layout e.pdf e.txt
          grep -n "Table 8\|Table 9\|Appendix 12\|kcal/d" e.txt | head -40
          echo "===== Tableau 8 ====="
          awk '/^ *Table 8:/{p=1} p{print; if(++n>70) exit}' e.txt
          echo "===== Annexes kcal enfants ====="
          awk '/Appendix 12[BC]|APPENDIX 12[BC]/{p=1} p{print; if(++n>160) exit}' e.txt
      - name: Eau EFSA 2010
        run: |
          curl -sSL -A "Mozilla/5.0" -o w.pdf "https://efsa.onlinelibrary.wiley.com/doi/pdf/10.2903/j.efsa.2010.1459" || true
          file w.pdf
          pdftotext -layout w.pdf w.txt || exit 0
          grep -n -i -E "adequate intake|mL/day|L/day" w.txt | head -60
