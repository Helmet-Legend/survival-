name: Sonde EFSA (temporaire)
on:
  push:
    branches: [ccr-68193128-o7em9g]
    paths: ['.github/workflows/sonde-efsa.yml']
jobs:
  sonde:
    runs-on: ubuntu-latest
    steps:
      - run: sudo apt-get install -y poppler-utils >/dev/null
      - name: Tableaux récapitulatifs EFSA (version finale)
        continue-on-error: true
        run: |
          for u in \
            "https://www.efsa.europa.eu/sites/default/files/assets/DRV_Summary_tables_jan_17.pdf" \
            "https://www.efsa.europa.eu/sites/default/files/2017_09_DRVs_summary_report.pdf"; do
            curl -sSL -A "Mozilla/5.0" -o s.pdf "$u"; file s.pdf
            if file s.pdf | grep -q PDF; then
              echo "##### $u"
              pdftotext -layout s.pdf s.txt
              grep -n -i -E "energy|water" s.txt | head -30
              awk 'tolower($0) ~ /energy/ {p=1} p{print; if(++n>120) exit}' s.txt
              echo "----- eau"
              awk 'tolower($0) ~ /water/ {p=1} p{print; if(++m>60) exit}' s.txt
            fi
          done
      - name: Énergie EFSA 2013, annexe 13 (kcal/j)
        continue-on-error: true
        run: |
          curl -sSL -A "Mozilla/5.0" -o e.pdf "https://www.efsa.europa.eu/sites/default/files/consultation/120720.pdf"
          pdftotext -layout e.pdf e.txt
          n=$(grep -n "Appendix 13" e.txt | tail -1 | cut -d: -f1)
          sed -n "$((n)),$((n+90))p" e.txt
