# Sonde temporaire : parcourt resilience-urbaine.com et relève les listes
# (sites injoignables depuis l'environnement de développement). À supprimer.
name: Sonde kits officiels

on:
  push:
    branches: [ccr-68193128-o7em9g]
    paths: ['.github/workflows/sonde-kits.yml']

jobs:
  pages:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Parcours du site
        run: |
          set +e
          python3 - <<'PY'
          import html, re, urllib.request, urllib.parse, collections
          UA = {'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) Chrome/124 Safari/537.36'}
          ROOT = 'https://www.resilience-urbaine.com/'
          host = urllib.parse.urlparse(ROOT).netloc
          def get(u):
              try:
                  r = urllib.request.urlopen(urllib.request.Request(u, headers=UA), timeout=30)
                  return r.geturl(), r.read().decode('utf-8', 'replace')
              except Exception as e:
                  print('ÉCHEC', u, e); return u, ''
          seen, queue, pages = set(), collections.deque([ROOT]), []
          # Plan du site, s'il existe.
          for sm in ['sitemap.xml', 'sitemap_index.xml', 'wp-sitemap.xml', 'page-sitemap.xml', 'post-sitemap.xml']:
              _, t = get(ROOT + sm)
              for loc in re.findall(r'<loc>([^<]+)</loc>', t):
                  if loc.endswith('.xml'):
                      _, t2 = get(loc)
                      queue.extend(re.findall(r'<loc>([^<]+)</loc>', t2))
                  else:
                      queue.append(loc)
          while queue and len(pages) < 200:
              u = queue.popleft().split('#')[0]
              if u in seen or urllib.parse.urlparse(u).netloc.replace('www.', '') != host.replace('www.', ''):
                  continue
              if re.search(r'\.(jpg|jpeg|png|gif|webp|svg|pdf|zip|css|js|xml)(\?|$)', u, re.I):
                  continue
              seen.add(u)
              final, t = get(u)
              if not t:
                  continue
              pages.append((final, t))
              for href in re.findall(r'href="([^"]+)"', t):
                  queue.append(urllib.parse.urljoin(final, html.unescape(href)))
          print('PAGES', len(pages))
          def clean(s):
              return re.sub(r'\s+', ' ', html.unescape(re.sub(r'<[^>]+>', ' ', s))).strip()
          for final, t in pages:
              title = clean((re.findall(r'(?is)<title>(.*?)</title>', t) or [''])[0])
              body = re.sub(r'(?is)<(script|style|noscript|svg|header|footer|nav).*?</\1>', ' ', t)
              items = [clean(x) for x in re.findall(r'(?is)<li[^>]*>(.*?)</li>', body)]
              items = [x for x in items if 2 < len(x) < 200]
              heads = [clean(x) for x in re.findall(r'(?is)<h[1-4][^>]*>(.*?)</h[1-4]>', body)]
              print('\n=====', final, '|', title)
              print('TITRES:', ' / '.join(h for h in heads if h)[:1500])
              if items:
                  print('LISTE:', ' ; '.join(items)[:6000])
          PY
