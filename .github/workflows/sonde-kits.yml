# Sonde temporaire : lit les listes officielles de kits d'urgence (sites
# injoignables depuis l'environnement de développement). À supprimer.
name: Sonde kits officiels

on:
  push:
    branches: [ccr-68193128-o7em9g]
    paths: ['.github/workflows/sonde-kits.yml']

jobs:
  lire:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - run: sudo apt-get install -y -qq poppler-utils >/dev/null
      - name: Téléchargement et extraction du texte
        run: |
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36"
          fetch() {
            name="$1"; url="$2"
            echo "=================== $name : $url"
            if ! curl -sSL -A "$UA" -m 60 -o "f-$name" "$url"; then echo "ÉCHEC"; return; fi
            if file "f-$name" | grep -q PDF; then
              pdftotext -layout "f-$name" - | sed 's/[[:space:]]\+/ /g' | grep -v '^ *$' | head -n 700
            else
              python3 - "f-$name" <<'PY'
          import sys, html, re
          t = open(sys.argv[1], encoding='utf-8', errors='replace').read()
          t = re.sub(r'(?is)<(script|style|noscript|svg|header|footer|nav).*?</\1>', ' ', t)
          t = re.sub(r'(?i)<(br|/p|/li|/h\d|/div|/tr)[^>]*>', '\n', t)
          t = html.unescape(re.sub(r'<[^>]+>', ' ', t))
          lines = [re.sub(r'\s+', ' ', l).strip() for l in t.splitlines()]
          print('\n'.join(l for l in lines if len(l) > 2)[:30000])
          PY
            fi
          }
          fetch bbk "https://www.bbk.bund.de/SharedDocs/Downloads/DE/Mediathek/Publikationen/Buergerinformationen/Ratgeber/ratgeber-notfallvosorge-checkliste.pdf?__blob=publicationFile&v=10"
          fetch readygov "https://www.ready.gov/kit"
          fetch tuntia "https://72tuntia.fi/wp-content/uploads/2025/01/spek_72_tuntia_varautuminen_kotona_2025_01_21_v01.pdf"
          fetch msb "https://rib.msb.se/filer/pdf/30828.pdf"
          fetch dsb "https://sikkerhverdag.no/globalassets/din-beredskap/brosjyrer-alle-sprak/dsb-egenberedskap-bokmal-uu-web_ny.pdf"
          fetch luxembourg "https://infocrise.public.lu/dam-assets/contenu/kit-urgence.pdf"
          fetch infogouv "https://www.info.gouv.fr/risques/se-preparer-a-une-situation-durgence"
          fetch sgdsn "https://www.info.gouv.fr/upload/media/mixed/0001/16/b250783992e0c766ae97bce7cb6eb1e8f081fe33.pdf"
          fetch canada "https://www.canada.ca/fr/services/police/urgences/protection/preparez-vous/kits-urgence/obtenir-kit.html"
          fetch georisques "https://www.georisques.gouv.fr/sites/default/files/2022-08/KIT%2072H_A4-HD.pdf"
          fetch belgique "https://centredecrise.be/fr/que-pouvez-vous-faire/kit-durgence"
          fetch suisse "https://www.bwl.admin.ch/bwl/fr/home/themen/notvorrat.html"
