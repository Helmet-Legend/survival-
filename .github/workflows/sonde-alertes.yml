# Temporaire : relève le format réel des flux d'alertes (à supprimer).
name: Sonde alertes
on:
  push:
    branches: [ccr-68193128-o7em9g]
jobs:
  sonde:
    runs-on: ubuntu-latest
    steps:
      - name: Relevés
        run: |
          probe() {
            echo "::group::$1"
            curl -sSL -m 60 -A "Fenrir/0.1 (sonde)" -D - "$1" -o body.bin || true
            echo "--- taille: $(wc -c < body.bin)"
            head -c "${2:-6000}" body.bin | iconv -f "${3:-utf-8}" -t utf-8 -c || true
            echo
            echo "::endgroup::"
          }
          probe "https://feeds.meteoalarm.org/api/v1/warnings/feeds-france" 2500
          probe "https://odre.opendatasoft.com/api/explore/v2.1/catalog/datasets/signal-ecogaz/records?limit=2" 2500
          probe "https://data.economie.gouv.fr/api/explore/v2.1/catalog/datasets/prix-des-carburants-en-france-flux-instantane-v2/records?limit=1&where=carburants_indisponibles%20is%20not%20null" 4000
          probe "https://data.economie.gouv.fr/api/explore/v2.1/catalog/datasets/prix-des-carburants-en-france-flux-instantane-v2/exports/json?select=id,code_departement,carburants_indisponibles,carburants_en_rupture_temporaire,carburants_en_rupture_definitive&limit=3" 3000
          probe "https://www.vigicrues.gouv.fr/services/v1.1/InfoVigiCru.json?TypEntVigiCru=7" 3000
          probe "https://www.vigicrues.gouv.fr/services/InfoVigiCru.json?TypEntVigiCru=8" 3000
          probe "https://www.vigicrues.gouv.fr/services/v1.1/TronEntVigiCru.json?CdEntVigiCru=AD1&TypEntVigiCru=8" 3000
          probe "https://www.vigicrues.gouv.fr/services/vigicrues.geojson" 2000
          probe "https://data.economie.gouv.fr/api/explore/v2.1/catalog/datasets/rappelconso-v2-gtin-trie/exports/json?select=gtin,numero_fiche,libelle,marque_produit,motif_rappel,conduites_a_tenir_par_le_consommateur,identification_produits,lien_vers_la_fiche_rappel,date_publication,date_de_fin_de_la_procedure_de_rappel&where=date_publication%3E%3D%222026-04-20%22" 1500
          echo "TAILLE RAPPELS 6 MOIS: $(wc -c < body.bin)"
          probe "https://api.vigieau.gouv.fr/api/zones?commune=75056&profil=particulier" 1500
          probe "https://api.vigieau.gouv.fr/api/departements" 1500
          probe "https://www.seismicportal.eu/fdsnws/event/1/query?limit=1&format=json&minmag=4&minlat=14&maxlat=52&minlon=-62&maxlon=56" 1500
