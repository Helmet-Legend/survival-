# Temporaire : relève le format réel des flux d'alertes (à supprimer).
name: Sonde alertes
on:
  push:
    branches: [ccr-68193128-o7em9g]
jobs:
  sonde:
    runs-on: ubuntu-latest
    steps:
      - name: Relevés
        run: |
          probe() {
            echo "::group::$1"
            curl -sSL -m 60 -A "Fenrir/0.1 (sonde)" -D - "$1" -o body.bin || true
            echo "--- taille: $(wc -c < body.bin)"
            head -c "${2:-6000}" body.bin | iconv -f "${3:-utf-8}" -t utf-8 -c || true
            echo
            echo "::endgroup::"
          }
          probe "https://feeds.meteoalarm.org/feeds/meteoalarm-legacy-atom-france" 9000
          probe "https://feeds.meteoalarm.org/api/v1/warnings/feeds-france" 6000
          probe "https://data.economie.gouv.fr/api/explore/v2.1/catalog/datasets/rappelconso-v2-gtin-trie/records?limit=2" 8000
          probe "https://data.economie.gouv.fr/api/explore/v2.1/catalog/datasets/rappelconso-v2-gtin-trie/exports/csv?limit=3" 4000
          probe "https://base-donnees-publique.medicaments.gouv.fr/download/file/CIS_CIP_Dispo_Spec.txt" 3000 latin1
          probe "https://www.vigicrues.gouv.fr/services/v1.1/" 3000
          probe "https://www.vigicrues.gouv.fr/services/1/InfoVigiCru.jsonld" 3000
          probe "https://www.vigicrues.gouv.fr/services/v1.1/TronEntVigiCru.json" 3000
          probe "https://api.vigieau.gouv.fr/api/zones?lon=2.35&lat=48.85&profil=particulier" 3000
          probe "https://odre.opendatasoft.com/api/explore/v2.1/catalog/datasets/signal-ecogaz/records?limit=3&order_by=gas_day%20desc" 3000
          probe "https://www.seismicportal.eu/fdsnws/event/1/query?limit=2&format=json&minlat=40&maxlat=52&minlon=-6&maxlon=10" 3000
          probe "https://data.economie.gouv.fr/api/explore/v2.1/catalog/datasets/prix-des-carburants-en-france-flux-instantane-v2/records?limit=1" 3000
