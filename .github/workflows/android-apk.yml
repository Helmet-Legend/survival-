# Vérifie le code puis compile un APK Android installable directement sur
# un téléphone (version de test, signée avec la clé de débogage).
#
# Cycle de développement :
# - chaque pull request vers `main` est vérifiée et compilée ;
# - chaque fusion dans `main` publie une « Release » GitHub avec l'APK ;
#   l'application la détecte au démarrage et propose de s'y mettre à jour.
name: APK Android

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typage et tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx eslint .
      - run: npx tsc --noEmit
      - run: npx jest --ci

  apk:
    name: Compilation de l'APK
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 0.1.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - run: npm ci
      - name: Base des médicaments (noms par code CIP, hors ligne)
        run: node scripts/build-medicines.mjs
      - name: Compilation (arm64-v8a, la quasi-totalité des téléphones récents)
        working-directory: android
        run: >-
          ./gradlew assembleGithubRelease --no-daemon --stacktrace
          -PreactNativeArchitectures=arm64-v8a
          -PversionCode=$VERSION_CODE -PversionName=$VERSION_NAME
      - name: Nommage de l'APK
        run: cp android/app/build/outputs/apk/github/release/app-github-release.apk "Fenrir-$VERSION_NAME.apk"
      - uses: actions/upload-artifact@v5
        with:
          name: fenrir-apk
          path: Fenrir-*.apk
          retention-days: 30
      - name: Publication de la version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "v$VERSION_NAME" "Fenrir-$VERSION_NAME.apk"
          --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA"
          --title "Fenrir $VERSION_NAME"
          --notes "$(git log -1 --pretty=%B | head -1)"
      # Version Google Play (app.fenrir) : paquet .aab à envoyer dans la Play
      # Console, signé avec la clé d'envoi si les secrets sont configurés.
      # Non publié dans la release GitHub (il ne s'installe pas directement).
      - name: Clé d'envoi Google Play
        env:
          KEYSTORE_B64: ${{ secrets.FENRIR_UPLOAD_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "FENRIR_UPLOAD_STORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Secrets de la clé d'envoi absents : le paquet Play est signé en débogage et sera refusé par la Play Console."
          fi
      - name: Paquet Google Play (AAB)
        working-directory: android
        env:
          FENRIR_UPLOAD_STORE_PASSWORD: ${{ secrets.FENRIR_UPLOAD_STORE_PASSWORD }}
          FENRIR_UPLOAD_KEY_ALIAS: ${{ secrets.FENRIR_UPLOAD_KEY_ALIAS }}
          FENRIR_UPLOAD_KEY_PASSWORD: ${{ secrets.FENRIR_UPLOAD_KEY_PASSWORD }}
        run: >-
          ./gradlew bundlePlayRelease --no-daemon --stacktrace
          -PreactNativeArchitectures=arm64-v8a,armeabi-v7a,x86_64
          -PversionCode=$VERSION_CODE -PversionName=$VERSION_NAME
      - name: Nommage du paquet Play
        run: cp android/app/build/outputs/bundle/playRelease/app-play-release.aab "Fenrir-play-$VERSION_NAME.aab"
      - uses: actions/upload-artifact@v5
        with:
          name: fenrir-play-aab
          path: Fenrir-play-*.aab
          retention-days: 90

  # Lance l'application finale (code réduit par R8) sur un téléphone Android
  # virtuel x86_64 : un plantage au démarrage (classe retirée à tort, module
  # natif absent) fait échouer ce contrôle. L'APK GitHub ne contient que le
  # code ARM 64 bits ; on part donc du paquet Play (même code, x86_64
  # compris), converti en APK universel. Ne bloque pas la publication.
  demarrage:
    name: Démarrage sur téléphone virtuel
    needs: apk
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: fenrir-play-aab
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: APK universel depuis le paquet Play
        run: |
          curl -sSLo bundletool.jar https://github.com/google/bundletool/releases/download/1.17.2/bundletool-all-1.17.2.jar
          keytool -genkeypair -keystore test.jks -alias test -storepass testtest -keypass testtest \
            -keyalg RSA -keysize 2048 -validity 1 -dname "CN=Test"
          java -jar bundletool.jar build-apks --bundle="$(ls Fenrir-play-*.aab)" --output=fenrir.apks \
            --mode=universal --ks=test.jks --ks-key-alias=test \
            --ks-pass=pass:testtest --key-pass=pass:testtest
          unzip -o fenrir.apks universal.apk
          unzip -l universal.apk | grep -E "lib/x86_64/libreactnative.so"
      - name: Accélération matérielle (KVM)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            adb install -r universal.apk
            adb logcat -c
            adb shell am start -W -n app.fenrir/com.resilios.MainActivity
            sleep 30
            adb logcat -d > logcat.txt
            if grep -E "FATAL EXCEPTION|AndroidRuntime: Process: app.fenrir|ClassNotFoundException: (com.resilios|com.facebook|com.op|com.poowf|com.oblador|com.horcrux|com.th3rdwave|org.linusu|com.lambdapioneer|zxingcpp|com.google.zxing)|NoSuchMethodError" logcat.txt; then echo "::error::Fenrir plante au démarrage"; grep -A30 "FATAL EXCEPTION" logcat.txt | head -80; exit 1; fi
            adb shell pidof app.fenrir || { echo "::error::Fenrir ne tourne plus après 30 s"; tail -100 logcat.txt; exit 1; }
            echo "Fenrir démarre et tourne après 30 s."

  # Version iPhone : fichier .ipa NON signé, à installer sans App Store avec
  # SideStore ou AltStore (signature par l'identifiant Apple de l'utilisateur).
  # N'empêche pas la publication de l'APK si elle échoue.
  ipa:
    name: Compilation iPhone (IPA)
    needs: checks
    runs-on: macos-15
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 0.1.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Base des médicaments (noms par code CIP, hors ligne)
        run: node scripts/build-medicines.mjs
      - name: Dépendances iOS (CocoaPods)
        working-directory: ios
        run: |
          bundle install
          bundle exec pod install
      - name: Compilation (Release, sans signature)
        run: |
          set -o pipefail
          xcodebuild -workspace ios/ResiliOS.xcworkspace -scheme ResiliOS \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -archivePath build/Fenrir.xcarchive \
            MARKETING_VERSION=$VERSION_NAME CURRENT_PROJECT_VERSION=$VERSION_CODE \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            archive > xcodebuild.log 2>&1 || {
              grep -E "error:|\*\* ARCHIVE FAILED|failed:" -A3 xcodebuild.log | head -n 150
              exit 1
            }
          tail -n 20 xcodebuild.log
      - name: Paquet IPA
        run: |
          mkdir -p Payload
          cp -R build/Fenrir.xcarchive/Products/Applications/ResiliOS.app Payload/
          zip -qry "Fenrir-$VERSION_NAME.ipa" Payload
          ls -lh "Fenrir-$VERSION_NAME.ipa"
      - uses: actions/upload-artifact@v5
        with:
          name: fenrir-ipa
          path: Fenrir-*.ipa
          retention-days: 30
      - name: Ajout à la version publiée
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # La version est créée par la compilation de l'APK : on l'attend.
          for i in $(seq 1 60); do
            if gh release view "v$VERSION_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release upload "v$VERSION_NAME" "Fenrir-$VERSION_NAME.ipa" --repo "$GITHUB_REPOSITORY" --clobber
              exit 0
            fi
            sleep 30
          done
          echo "Version v$VERSION_NAME introuvable : IPA non publiée." >&2
          exit 1
