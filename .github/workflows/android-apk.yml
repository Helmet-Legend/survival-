# Vérifie le code puis compile un APK Android installable directement sur
# un téléphone (version de test, signée avec la clé de débogage).
#
# Cycle de développement :
# - chaque pull request vers `main` est vérifiée et compilée ;
# - chaque fusion dans `main` publie une « Release » GitHub avec l'APK ;
#   l'application la détecte au démarrage et propose de s'y mettre à jour.
name: APK Android

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typage et tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx eslint .
      - run: npx tsc --noEmit
      - run: npx jest --ci

  apk:
    name: Compilation de l'APK
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 0.1.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - run: npm ci
      - name: Base des médicaments (noms par code CIP, hors ligne)
        run: node scripts/build-medicines.mjs
      - name: Compilation (arm64-v8a, la quasi-totalité des téléphones récents)
        working-directory: android
        run: >-
          ./gradlew assembleRelease --no-daemon --stacktrace
          -PreactNativeArchitectures=arm64-v8a
          -PversionCode=$VERSION_CODE -PversionName=$VERSION_NAME
      - name: Nommage de l'APK
        run: cp android/app/build/outputs/apk/release/app-release.apk "Fenrir-$VERSION_NAME.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: fenrir-apk
          path: Fenrir-*.apk
          retention-days: 30
      - name: Publication de la version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "v$VERSION_NAME" "Fenrir-$VERSION_NAME.apk"
          --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA"
          --title "Fenrir $VERSION_NAME"
          --notes "$(git log -1 --pretty=%B | head -1)"
